# Function boundary overrides for cardsdll (filled in as codegen reports them).

# The dispatch table (twice the code size, 0x4271E8 bytes) would start right after the image at 0x89330000 and
# run into powdllzf's image at 0x89700000, which the game loads at boot: moved to the free space between
# default.xex's table (ends 0x86B36630) and FootballCompEngzf's image (0x88000000).
function_table_base = 0x87000000

[functions]

# Tail-call targets codegen reported as "target not in any function".
[functions."0x8906635C"]
name = "sub_8906635C"

[functions."0x8913FE80"]
name = "sub_8913FE80"


